  headline: Quinn and Mackenzie attened the European Association for Neuro-Oncology Annual Meeting in Glasgow, Scotland.
  text: Mackenzie presented our ongoing work on the associationed between [air pollition and brain tumor incidence](https://doi.org/10.1093/neuonc/noae144.444).
