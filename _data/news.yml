- date: May 2026
  headline: Come work with us! 
  text: The Ostrom Lab in the Department of Neurosurgery is looking for an experienced research analyst to join our team focused on identifying risk factors for primary and metastatic brain tumors. This role involves providing leadership and expertise in conducting complex research activities, including planning, organizing, conducting, and communicating multiple research epidemiological studies. Please apply via [Duke Careers](https://careers.duke.edu/job/Durham-RESEARCH-ANALYST-I-NC-27710/1390512700/).

