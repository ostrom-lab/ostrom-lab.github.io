- date: November 2024
  headline: Christine and Quinn presented ongoing work from the Lab at the Society for Neuro-Oncology Annual Meeting in Houston, Texas
  text: Christine presented her work on <a href="https://doi.org/10.1093/neuonc/noae165.0552">variation in glioma risk due to ancestral allele frequency differences</a>. We also presented on <a href="https://academic.oup.com/neuro-oncology/article/26/Supplement_8/viii138/7889649?searchresult=1">variation in meningioma incidence by sex and race/ethnicity</a> and the association between <a href="https://doi.org/10.1093/neuonc/noae165.0559">autoimmune disease and improved survival in glioblastoma</a>
  
- date: November 2024
