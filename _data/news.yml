- date: May 2024
  headline: Christine and Mackenzie presented at the Brain Tumor Epidemiology Consortium Annual Meeting in Mainz, Germany
  image: "IMG_2798.JPG"
  text:  Christine presented her work on "The Effect of Prior Varicella Zoster Infection on a Person’s Risk of Glioma Development", while Mackenzie presented on "Multiscale Geographically Weighted Linear Regression for County-Level Glioblastoma Incidence Modeling in the United States". See our published [meeting summary](https://doi.org/10.1093/noajnl/vdaf095) for more information on this meeting. 

