- date: November 2024
  headline: Christine and Quinn presented ongoing work from the Lab at the Society for Neuro-Oncology Annual Meeting in Houston, Texas
  text: Christine presented her work on [variation in glioma risk due to ancestral allele frequency differences](https://doi.org/10.1093/neuonc/noae165.0552). We also presented on [variation in mengioma incidence by sex and race/ethnicity](https://academic.oup.com/neuro-oncology/article/26/Supplement_8/viii138/7889649?searchresult=1) and the association between [autoimmune disease and improved survival in glioblastoma](https://doi.org/10.1093/neuonc/noae165.0559)
- date: November 2024
  headline: We are hosting the [Brain Tumor Epidemiology Consortium](https://sites.usc.edu/braintumorcause/) Annual Meeting in Durham in May 2025
