- date: December 2025
  headline: Paper published in Neuro-Oncology
  text: Our paper, [Gabapentin repurposing for glioblastoma therapy: Real-world data analyses augmented by use of active comparators](https://pubmed.ncbi.nlm.nih.gov/41359781/) is published in *Neuro-Oncology*.

- date: June 23 2025
  headline: Paper published in CEBP
  text: Our paper, (Atopy improves survival and decreases risk of brain metastasis in cutaneous melanoma)[https://pubmed.ncbi.nlm.nih.gov/40548861/], is published in *Cancer, Epidemiology, Biomarkers, and Prevention*!
  
- date: June 15 2025
  headline: Paper published in Neuro-Oncology 
  text: Our paper, [Years of life lost due to central nervous system tumor subtypes in the United States](https://pubmed.ncbi.nlm.nih.gov/40517297/), is published in *Neuro-Oncology*.
  
