
<div class="well">
<h4>News</h4>

{% for article in site.data.news limit:5 %}
<p>{{ article.date }}<br>{{ article.headline | markdownify}}</p>

  {% if article.image contains "." %}
  <img src="https://ostrom-lab.github.io/images/news/ {{ article.image }}" style="align: center;" width=95%>
  {% endif %}
{% endfor %}

<h4><a href="{{ site.url }}{{ site.baseurl }}/allnews.html">... see all News</a></h4>

    </div>
