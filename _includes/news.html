
<div class="well">
<h4>News</h4>

{% for article in site.data.news limit:5 %}
<p><b>{{ article.date }}</b>: {{ article.headline | markdownify}}</p>

  {% if article.image contains "." %}
<p> <img src="https://ostrom-lab.github.io/images/news/{{ article.image }}" style="align: center;" width=95%></p>
  {% endif %}
{% endfor %}

<h4><a href="{{ site.url }}{{ site.baseurl }}/_pages/allnews.html">... see all News</a></h4>

    </div>
